# Build the single-file flashable image, attach it to a release, and publish the
# browser flasher to Pages.
#
# A user needs neither this repo nor ESP-IDF: one file, one offset. The image is
# bootloader + partition table + app + blob merged, and it was verified the
# honest way -- erase_flash, write it at 0x0, and the board boots and routes with
# nothing else on the chip.
name: release image

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # A tag must not be able to publish a build that does not pass. Without this
  # gate the release workflow was entirely independent of the test suite, so
  # tagging a broken tree would have shipped a broken image to strangers.
  verify:
    name: host regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: make fetch
      - run: make tools
      - run: ./scripts/regress.sh

  image:
    name: single-file image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build PRODUCT firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32
          path: esp32_router
          command: idf.py -DPRODUCT=1 -DRD=256 -DTPOPCNT=1 build

      # merge-bin, not esptool with hand-written offsets: it reads the offsets
      # out of the build that just happened. Hardcoding 0x1000/0x8000/0x10000 is
      # correct only until partitions.csv moves, and a moved app would produce a
      # plausible image of exactly the right size that does not boot.
      #
      # Output goes INSIDE the build directory, then a host step copies it out.
      # esp-idf-ci-action runs in a container that mounts the repo at /app/...,
      # so ${{ github.workspace }} is a host path that does not exist in there —
      # passing it fails with FileNotFoundError on a directory that is right
      # in front of you on the runner.
      - name: Merge into one image
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32
          path: esp32_router
          command: idf.py merge-bin -o mogwai-esp32.bin

      - name: Bring the image out of the container's build dir
        run: |
          cp esp32_router/build/mogwai-esp32.bin mogwai-esp32.bin
          ls -l mogwai-esp32.bin

      # Nothing else in this chain checks that the data which came OUT is the
      # data that went IN. A stale build dir or a wrong app would pass every
      # other step.
      - name: The image must contain the shipped blob
        run: |
          make c/bin/imgcheck
          c/bin/imgcheck mogwai-esp32.bin esp32_router/main/router.bin

      - name: Checksum, and stage the flasher
        run: |
          sha256sum mogwai-esp32.bin | tee mogwai-esp32.bin.sha256
          grep -q '"version": "dev"' flash/manifest.json \
            || { echo "manifest is not the unstamped 'dev' template"; exit 1; }
          sed -i "s/\"version\": \"dev\"/\"version\": \"${GITHUB_REF_NAME}\"/" flash/manifest.json
          # ESP Web Tools fetches the image relative to the manifest.
          cp mogwai-esp32.bin flash/
          ls -l flash/

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mogwai-esp32.bin
            mogwai-esp32.bin.sha256

      # Pages must only ever serve a RELEASE. A workflow_dispatch on a branch
      # would otherwise republish the flasher with a branch-stamped manifest,
      # quietly downgrading the provenance of a page whose whole job is to tell
      # people which build they are about to put on their hardware.
      - uses: actions/upload-pages-artifact@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          path: flash

  # Uploading an artifact does NOT publish it. Pages needs its own job with the
  # github-pages environment; without this the flasher page silently never
  # appears, which is exactly how it was written the first time. Tags also need
  # an explicit deployment-branch policy on that environment.
  #
  # And the repository's Pages source MUST be "GitHub Actions", not "Deploy from
  # a branch". With the legacy branch builder enabled the two fight: this job
  # publishes the flasher, then the next push to main triggers the branch build,
  # which serves the repo root -- no index.html -- and the page 404s. It looked
  # like a working deployment that spontaneously died.
  deploy:
    name: publish the flasher
    needs: image
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
