# Build the single-file flashable image, attach it to a release, and publish the
# browser flasher to Pages.
#
# The point is that a user needs neither this repo nor ESP-IDF: one file, one
# offset. The image is bootloader + partition table + app + blob merged, and it
# was verified the honest way before any of this existed -- erase_flash, write it
# at 0x0, and the board boots and routes with nothing else on the chip.
name: release image

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  image:
    name: single-file image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build PRODUCT firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32
          path: esp32_router
          command: idf.py -DPRODUCT=1 -DRD=256 -DTPOPCNT=1 build

      # merge_bin ships with ESP-IDF; the file it produces needs none of it.
      - name: Merge into one image
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32
          path: esp32_router
          command: >
            esptool.py --chip esp32 merge_bin -o ../mogwai-esp32.bin
            --flash_mode dio --flash_freq 80m --flash_size 4MB
            0x1000 build/bootloader/bootloader.bin
            0x8000 build/partition_table/partition-table.bin
            0x10000 build/router_validate.bin

      - name: Checksum, and stage the flasher
        run: |
          sha256sum mogwai-esp32.bin | tee mogwai-esp32.bin.sha256
          # The manifest ships as "dev"; stamp it with whatever produced this run.
          sed -i "s/\"version\": \"dev\"/\"version\": \"${GITHUB_REF_NAME}\"/" flash/manifest.json
          # ESP Web Tools fetches the image relative to the manifest, so it has
          # to sit beside it in the published directory.
          cp mogwai-esp32.bin flash/
          ls -l flash/

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mogwai-esp32.bin
            mogwai-esp32.bin.sha256

      - uses: actions/upload-pages-artifact@v3
        with:
          path: flash

  # Uploading an artifact does NOT publish it. Pages needs its own job with the
  # github-pages environment; without this the flasher page silently never
  # appears, which is exactly how it was written the first time.
  deploy:
    name: publish the flasher
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
