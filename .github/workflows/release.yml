# Build the single-file flashable image and attach it to a release.
#
# The point is that a user needs neither this repo nor ESP-IDF: one file, one
# offset. The image is bootloader + partition table + app + blob merged, and it
# is verified the honest way before shipping — erase_flash, write at 0x0, and
# the board boots and routes with nothing else on the chip.
name: release image

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  image:
    name: single-file image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build PRODUCT firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32
          path: esp32_router
          command: idf.py -DPRODUCT=1 -DRD=256 -DTPOPCNT=1 build

      # merge_bin ships with ESP-IDF; the resulting file needs none of it.
      - name: Merge into one image
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32
          path: esp32_router
          command: >
            esptool.py --chip esp32 merge_bin -o ../mogwai-esp32.bin
            --flash_mode dio --flash_freq 80m --flash_size 4MB
            0x1000 build/bootloader/bootloader.bin
            0x8000 build/partition_table/partition-table.bin
            0x10000 build/router_validate.bin

      - name: Checksum and manifest
        run: |
          sha256sum mogwai-esp32.bin | tee mogwai-esp32.bin.sha256
          # stamp the web-flasher manifest with this tag
          sed -i "s/\"version\": \"dev\"/\"version\": \"${GITHUB_REF_NAME:-dev}\"/" flash/manifest.json
          cp mogwai-esp32.bin flash/
          ls -l mogwai-esp32.bin

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mogwai-esp32.bin
            mogwai-esp32.bin.sha256

      # The browser flasher needs the image beside the manifest.
      - name: Publish the web flasher
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-pages-artifact@v3
        with:
          path: flash
