name: regress

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  host:
    name: host regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: cc --version && make --version | head -1

      # The corpora are fetched, never vendored. data/SHA256 is tracked, so this
      # step also proves the upstreams still serve the exact bytes we measured on.
      - name: Fetch corpora
        run: make fetch

      - name: Verify corpus checksums
        run: shasum -a 256 -c data/SHA256

      # 45 checks: build with zero warnings, an exhaustive 2^32 popcount proof,
      # blob layout vs its own documentation, the six shipped-config numbers, all
      # four leak guards, and the negative results that must keep reproducing.
      # Two archive checks skip here by design — archive/ is local-only.
      - name: Regression suite
        run: make regress

      - name: Shipped numbers
        run: |
          ./c/bin/compare --ship 2>/dev/null | grep -E '^ROW' | tee /tmp/row.tsv
          awk -F'\t' '$3 ~ /twin/ && ($4!="85.9" || $6!="1" || $7!="13" || $8!="14") \
            { print "shipped numbers drifted"; exit 1 }' /tmp/row.tsv

      # The repo should demo itself. If this stops routing, the README is lying.
      - name: Demo routes an utterance
        run: |
          ./c/bin/compare --ship --route="turn off the kitchen light" \
            | grep -qE '^ +decision +iot_hue_lightoff$'

  firmware:
    name: esp32 firmware build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The firmware's router.c/ternary.c are SYMLINKS into c/src, so this also
      # proves a host-side change did not break the device build. sdkconfig is
      # not tracked; ESP-IDF regenerates it from sdkconfig.defaults, exactly as
      # a fresh clone would.
      - name: Build validation firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32
          path: esp32_router
          command: idf.py -DRD=256 -DTPOPCNT=1 build

      # The device firmware shares router.c/ternary.c by symlink, so a host
      # change is a device change. Untested, it rots the way the host code did.
      - name: Build PRODUCT firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32
          path: esp32_router
          command: idf.py -DPRODUCT=1 -DRD=256 -DTPOPCNT=1 build

      - name: Artefacts exist
        run: |
          test -f esp32_router/build/router_validate.bin
          test -f esp32_router/build/bootloader/bootloader.bin
          ls -l esp32_router/build/router_validate.bin

      # BLOB_FORMAT.md: "blob and firmware must agree on RD or parity is
      # measuring nothing". The blob header carries dim at byte offset 4;
      # router.h carries RD. A mismatch is silent on device until parity fails.
      - name: Blob dim matches the firmware's RD
        run: |
          DIM=$(od -An -tu4 -j4 -N4 esp32_router/main/router.bin | tr -d ' ')
          RD=$(grep -E '^#define RD\s' c/src/router.h | grep -oE '[0-9]+')
          echo "blob dim=$DIM  router.h RD=$RD"
          test "$DIM" = "$RD"

      # The bootloader is WRITTEN in dio for both QIO and QOUT - the ROM must read
      # it before quad exists - so its mode byte is 2 either way and cannot tell
      # QIO from DIO. Asserting the byte would be a check that can never fail.
      # The choice symbol in the generated sdkconfig is what actually differs.
      - name: Flash mode is QIO
        run: |
          # sdkconfig is generated inside the action's container; if the
          # workspace mount does not persist it, say so plainly rather than
          # failing on an opaque grep.
          test -f esp32_router/sdkconfig || { echo "sdkconfig not persisted from the build container"; exit 1; }
          grep -q '^CONFIG_ESPTOOLPY_FLASHMODE_QIO=y' esp32_router/sdkconfig
          B=$(od -An -tu1 -j2 -N1 esp32_router/build/bootloader/bootloader.bin | tr -d ' ')
          echo "QIO selected; bootloader written in mode $B (2=dio, upgraded to quad at init)"
          test "$B" = "2"
